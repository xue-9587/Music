<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 音乐馆 · Music Hall</title>
<style>
/* ========== 基础 & 主题变量 ========== */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#040404;
  --panel:#0d0d0d;
  --panel-2:#171717;
  --tx:#ededed;
  --tx2:#808080;
  --p:#d6d6d6;          /* 亮灰（强调） */
  --c:#7d7d7d;          /* 中灰（辅助） */
  --sd:rgba(0,0,0,.9);  /* 拟物暗阴影 */
  --sl:rgba(255,255,255,.028); /* 拟物亮阴影 */
}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  color:var(--tx);
  min-height:100vh;
  padding:28px clamp(14px,4vw,48px) 64px;
  background:var(--bg);
  background-image:
    radial-gradient(circle at 12% -5%,rgba(255,255,255,.035),transparent 42%),
    radial-gradient(circle at 88% 8%,rgba(255,255,255,.02),transparent 42%);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1200px;margin:0 auto}

/* ========== 顶栏 ========== */
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
h1{font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:1px;display:flex;align-items:center;gap:12px}
h1 .dot{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--c));box-shadow:0 0 16px var(--p)}
.badge{font-size:12px;color:var(--tx2);padding:9px 16px;border-radius:30px;background:var(--panel);box-shadow:inset 3px 3px 7px var(--sd),inset -3px -3px 7px var(--sl)}

/* ========== 横向封面播放器 ========== */
.player{
  display:flex;align-items:center;gap:clamp(18px,3vw,34px);
  background:var(--panel);border-radius:24px;padding:clamp(18px,3vw,30px);
  box-shadow:10px 10px 26px var(--sd),-9px -9px 22px var(--sl);
  margin-bottom:34px;
}
.pcover{
  flex:0 0 clamp(150px,21vw,228px);aspect-ratio:1;border-radius:18px;overflow:hidden;position:relative;
  box-shadow:0 14px 34px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.06);
}
.pcover img{width:100%;height:100%;object-fit:cover;display:block}
.pcover .fb{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:64px;background:linear-gradient(135deg,#1a1a1a,#0a0a0a)}
.pinfo{flex:1;min-width:0}
.ptag{font-size:11px;letter-spacing:2px;color:var(--c);margin-bottom:8px;display:block}
.ptitle{font-size:clamp(20px,3vw,31px);font-weight:700;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.partist{color:var(--tx2);font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:8px}

/* 频谱均衡器（CSS 动画，播放时滚动） */
.eq{display:flex;gap:4px;align-items:flex-end;height:26px;margin-bottom:14px}
.eq i{width:4px;border-radius:4px;background:#fff;height:18%;animation:eq .9s ease-in-out infinite alternate;animation-play-state:paused;opacity:.9}
.player.playing .eq i{animation-play-state:running}
@keyframes eq{from{height:14%}to{height:100%}}

/* 进度条 */
.seekrow{display:flex;align-items:center;gap:12px}
.bar{-webkit-appearance:none;appearance:none;flex:1;height:8px;border-radius:8px;background:#09090e;box-shadow:inset 2px 2px 5px var(--sd),inset -1px -1px 3px var(--sl);outline:none;cursor:pointer}
.bar::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--c));box-shadow:0 0 12px rgba(255,255,255,.45);cursor:pointer}
.bar::-moz-range-thumb{width:15px;height:15px;border:none;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--c));box-shadow:0 0 12px rgba(255,255,255,.45);cursor:pointer}
.tm{font-size:12px;color:var(--tx2);font-variant-numeric:tabular-nums;min-width:38px}

/* 控制按钮 */
.ctrl{display:flex;align-items:center;gap:13px;margin-top:18px;flex-wrap:wrap}
.btn{border:none;cursor:pointer;color:var(--tx);background:var(--panel-2);box-shadow:5px 5px 11px var(--sd),-5px -5px 11px var(--sl);border-radius:14px;display:flex;align-items:center;justify-content:center;transition:.18s;user-select:none}
.btn:hover{color:#fff;transform:translateY(-2px)}
.btn:active{box-shadow:inset 4px 4px 8px var(--sd),inset -4px -4px 8px var(--sl);transform:translateY(0)}
.btn.sm{width:42px;height:42px;font-size:15px}
.btn.play{
  width:58px;height:58px;border-radius:50%;font-size:21px;
  border:1px solid transparent;background:transparent;
  background-image:linear-gradient(var(--panel),var(--panel)),linear-gradient(135deg,var(--p),var(--c));
  background-origin:border-box;background-clip:padding-box,border-box;
  box-shadow:0 8px 24px rgba(255,255,255,.12);
}
.vol{display:flex;align-items:center;gap:8px;margin-left:auto;color:var(--tx2);font-size:14px}
.vol input{width:96px;accent-color:var(--p);height:6px;cursor:pointer}
/* 控制图标：明文内联 SVG（零依赖） */
.btn svg{width:19px;height:19px;display:block;pointer-events:none;filter:brightness(1.15)}
.btn.play svg{width:26px;height:26px}
.vol svg{width:18px;height:18px;display:block;opacity:.9}

/* ========== 歌曲列表 ========== */
.sec{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
.sec b{font-size:19px}
.sec span{font-size:13px;color:var(--tx2)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,1.6vw,16px)}
/* 歌曲按钮（无封面） */
.songbtn{
  display:flex;align-items:center;gap:10px;width:100%;min-width:0;text-align:left;font-family:inherit;
  color:var(--tx);cursor:pointer;background:var(--panel);border:1px solid transparent;border-radius:15px;padding:13px 13px;
  box-shadow:6px 6px 14px var(--sd),-6px -6px 12px var(--sl);transition:transform .18s,border-color .18s;
}
.songbtn:hover{transform:translateY(-3px)}
.songbtn:active{box-shadow:inset 4px 4px 9px var(--sd),inset -4px -4px 9px var(--sl);transform:translateY(0)}
.songbtn.active{border-color:var(--p);box-shadow:6px 6px 14px var(--sd),-6px -6px 12px var(--sl),0 0 0 1px var(--p),0 9px 24px rgba(255,255,255,.1)}
.songbtn .num{width:27px;height:27px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--tx2);background:var(--panel-2);box-shadow:inset 2px 2px 5px var(--sd),inset -2px -2px 5px var(--sl)}
.songbtn.active .num{background:linear-gradient(135deg,var(--p),var(--c));color:#fff;box-shadow:none}
.songbtn .ico{font-size:19px;flex:none;line-height:1}
.songbtn .txt{flex:1;min-width:0}
.songbtn .nm{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.songbtn .state{width:15px;height:15px;flex:none;display:block;opacity:0;transition:.18s;filter:brightness(1.15)}
.songbtn.active .state{opacity:1}

/* ========== 返回顶部 ========== */
#toTop{
  position:fixed;right:clamp(16px,3vw,34px);bottom:clamp(16px,3vw,34px);z-index:50;
  width:50px;height:50px;border-radius:50%;cursor:pointer;color:var(--tx);font-size:19px;
  border:1px solid transparent;background:transparent;
  background-image:linear-gradient(var(--panel),var(--panel)),linear-gradient(135deg,var(--p),var(--c));
  background-origin:border-box;background-clip:padding-box,border-box;
  box-shadow:0 10px 28px rgba(255,255,255,.14);
  opacity:0;visibility:hidden;transform:translateY(16px);transition:opacity .25s,transform .25s,visibility .25s;
}
#toTop.show{opacity:1;visibility:visible;transform:translateY(0)}
#toTop:hover{transform:translateY(-4px)}

/* ========== 响应式 ========== */
@media(max-width:880px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:560px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .songbtn{gap:7px;padding:11px 9px;border-radius:12px}
  .songbtn .num{width:22px;height:22px;font-size:11px}
  .songbtn .ico{font-size:16px}
  .songbtn .nm{font-size:12px}
  .songbtn .state{width:12px;height:12px}
  .player{flex-direction:column;text-align:center}
  .pcover{flex:none;width:min(72vw,240px)}
  .partist{justify-content:center}
  .ctrl{justify-content:center}
  .vol{margin-left:0;width:100%;justify-content:center}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="dot"></span>🎵 音乐馆</h1>
    <div class="badge">🎧 即点即播</div>
  </header>

  <!-- 横向封面播放器 -->
  <section class="player" id="player">
    <div class="pcover" id="pcover"><img id="pcoverImg" alt="封面" src="https://picsum.photos/seed/musichall-cover/600?grayscale" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="fb">🎵</div></div>
    <div class="pinfo">
      <span class="ptag">NOW PLAYING</span>
      <div class="ptitle" id="ptitle">选择一首歌开始</div>
      <div class="partist"><span id="partist">纯暗黑音乐馆</span></div>
      <div class="eq" id="eq"></div>
      <div class="seekrow">
        <span class="tm" id="cur">0:00</span>
        <input type="range" class="bar" id="bar" value="0" min="0" max="1000" aria-label="播放进度">
        <span class="tm" id="dur">0:00</span>
      </div>
      <div class="ctrl">
        <button class="btn sm" id="prev" title="上一首">
          <svg viewBox="0 0 24 24" fill="#ededed"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="btn play" id="toggle" title="播放/暂停">
          <svg id="playImg" viewBox="0 0 24 24" fill="#ededed"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="btn sm" id="next" title="下一首">
          <svg viewBox="0 0 24 24" fill="#ededed"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
        </button>
        <div class="vol">
          <svg viewBox="0 0 24 24" fill="#ededed"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4z"/></svg>
          <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="音量">
        </div>
      </div>
    </div>
  </section>

  <!-- 歌曲列表：4 首一行 -->
  <div class="sec"><b>曲库</b><span id="count"></span></div>
  <div class="grid" id="grid"></div>
</div>

<button id="toTop" title="返回顶部" aria-label="返回顶部">⬆️</button>
<audio id="audio" preload="metadata"></audio>

<script>
/* ===== 歌曲数据：音源均为外链（SoundHelix 公开测试音频）=====
   封面使用 picsum.photos，加载失败自动回退为 emoji 渐变封面       */
const songs = [
  {n:'六哲 - 落泥花', e:'🌃', c:'https://picsum.photos/seed/hall1/500',  u:'https://57zy.ccwu.cc/%E5%85%AD%E5%93%B2%20-%20%E8%90%BD%E6%B3%A5%E8%8A%B1.m4a'},
  {n:'星尘来信', e:'✨', c:'https://picsum.photos/seed/hall2/500',  u:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3'},
  {n:'深海回声', e:'🌊', c:'https://picsum.photos/seed/hall3/500',  u:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3'},
  {n:'晨雾列车', e:'🚂', c:'https://picsum.photos/seed/hall4/500',  u:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3'},
  {n:'落日飞行', e:'🌅', c:'https://picsum.photos/seed/hall5/500',  u:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3'},
  {n:'像素心跳', e:'💗', c:'https://picsum.photos/seed/hall6/500',  u:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3'},
  {n:'真空漫游', e:'🪐', c:'https://picsum.photos/seed/hall7/500',  u:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3'},
  {n:'雨夜书局', e:'🌧️', c:'https://picsum.photos/seed/hall8/500',  u:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3'},
  {n:'云端信号', e:'☁️', c:'https://picsum.photos/seed/hall9/500',  u:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3'},
  {n:'午夜电台', e:'📻', c:'https://picsum.photos/seed/hall10/500', u:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3'},
  {n:'极光边界', e:'🌌', c:'https://picsum.photos/seed/hall11/500', u:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-11.mp3'},
  {n:'逆时针',   e:'🎐', c:'https://picsum.photos/seed/hall12/500', u:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-12.mp3'}
];

const audio   = document.getElementById('audio');
const player  = document.getElementById('player');
const bar     = document.getElementById('bar');
const toggleB = document.getElementById('toggle');
const grid    = document.getElementById('grid');
let cur = 0, seeking = false;
audio.volume = 0.8;

/* ===== 控制图标：明文内联 SVG，播放/暂停切换 path 的 d ===== */
const PATH_PLAY  = 'M8 5v14l11-7z';
const PATH_PAUSE = 'M6 5h4v14H6zm8 0h4v14h-4z';
const playImg = document.getElementById('playImg');
function setPlayIcon(on){ playImg.firstElementChild.setAttribute('d', on ? PATH_PAUSE : PATH_PLAY); }
setPlayIcon(false);

/* 封面加载：失败回退 emoji */
function setCover(box, s, imgSel, fbSel){
  const img = box.querySelector(imgSel), fb = box.querySelector(fbSel);
  img.style.display='block'; fb.style.display='none';
  img.onerror = ()=>{ img.style.display='none'; fb.style.display='flex'; fb.textContent = s.e; };
  img.src = s.c;
}
function fmt(t){ if(isNaN(t)) return '0:00'; const m=Math.floor(t/60), s=Math.floor(t%60); return m+':'+(s<10?'0':'')+s; }

/* 生成频谱条（多彩渐变） */
const eq = document.getElementById('eq');
for(let i=0;i<26;i++){
  const b=document.createElement('i');
  const h1=Math.round(i*360/26), h2=(h1+45)%360;
  b.style.background='linear-gradient(180deg,hsl('+h1+',95%,70%),hsl('+h2+',95%,50%))';
  b.style.boxShadow='0 0 7px hsla('+h1+',95%,60%,.55)';
  b.style.animationDelay=(-Math.random()).toFixed(2)+'s';
  b.style.animationDuration=(0.5+Math.random()*0.7).toFixed(2)+'s';
  eq.appendChild(b);
}

/* 生成歌曲按钮（无封面） */
songs.forEach((s,i)=>{
  const d=document.createElement('button');
  d.type='button';
  d.className='songbtn';
  d.innerHTML='<span class="num">'+String(i+1).padStart(2,'0')+'</span>'+
              '<span class="ico">'+s.e+'</span>'+
              '<span class="txt"><span class="nm">'+s.n+'</span></span>'+
              '<svg class="state" viewBox="0 0 24 24" fill="#ededed"><path d="'+PATH_PLAY+'"/></svg>';
  d.onclick = ()=>{ i===cur ? togglePlay() : load(i, true); };
  grid.appendChild(d);
});
document.getElementById('count').textContent = '共 '+songs.length+' 首 · 每行 4 首（窄屏自动 2 / 1 列）';

/* 返回顶部：滚动超过 180px 显示，点击平滑回顶 */
const toTop=document.getElementById('toTop');
window.addEventListener('scroll',()=>{ toTop.classList.toggle('show', window.scrollY>180); },{passive:true});
toTop.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});

/* 加载曲目 */
function load(i, autoplay){
  cur=(i+songs.length)%songs.length;
  const s=songs[cur];
  document.getElementById('ptitle').textContent=s.n;
  document.getElementById('partist').textContent='纯暗黑音乐馆';
  audio.src=s.u;
  audio.load();
  document.querySelectorAll('.songbtn').forEach((el,k)=>el.classList.toggle('active',k===cur));
  if(autoplay) play();
}
/* 播放 / 暂停 */
function play(){ audio.play().then(()=>player.classList.add('playing')).catch(()=>{}); }
function pause(){ audio.pause(); player.classList.remove('playing'); }
function togglePlay(){ audio.paused ? play() : pause(); }

toggleB.onclick=togglePlay;
document.getElementById('prev').onclick=()=>load(cur-1,true);
document.getElementById('next').onclick=()=>load(cur+1,true);

/* 进度与事件 */
audio.addEventListener('timeupdate',()=>{
  if(!seeking && audio.duration) bar.value=Math.round(audio.currentTime/audio.duration*1000);
  document.getElementById('cur').textContent=fmt(audio.currentTime);
});
audio.addEventListener('loadedmetadata',()=>{ document.getElementById('dur').textContent=fmt(audio.duration); });
audio.addEventListener('ended',()=>load(cur+1,true));
audio.addEventListener('pause',()=>{ player.classList.remove('playing'); setPlayIcon(false); });
audio.addEventListener('play', ()=>{ player.classList.add('playing');  setPlayIcon(true);  });

bar.addEventListener('input',()=>{ seeking=true; if(audio.duration) audio.currentTime=bar.value/1000*audio.duration; });
bar.addEventListener('change',()=>{ seeking=false; });
document.getElementById('vol').addEventListener('input',e=>{ audio.volume=parseFloat(e.target.value); });

/* 初始化：显示第一首但不自动播放（遵守浏览器自动播放策略） */
load(0,false);
</script>
</body>
</html>
